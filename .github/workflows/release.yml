name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Rename binary
        run: cp target/release/wee target/release/wee-linux-x86_64

      - name: Generate checksum
        run: |
          sha256sum target/release/wee-linux-x86_64 \
            > target/release/wee-linux-x86_64.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/wee-linux-x86_64
            target/release/wee-linux-x86_64.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
